name: Yomu Pace

on:
  pull_request:
    paths:
      - 'yomu-pace/**'
      - '.github/workflows/yomu-pace.yml'
  push:
    branches: [main]
    paths:
      - 'yomu-pace/**'
      - '.github/workflows/yomu-pace.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yomu-pace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: yomu-pace-v0.1-build
          path: |
            yomu-pace/dist
            yomu-pace/package-lock.json
          if-no-files-found: error
          retention-days: 14
