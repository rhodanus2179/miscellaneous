name: Yomu Pace

on:
  pull_request:
    paths:
      - 'yomu-pace/**'
      - '.github/workflows/yomu-pace.yml'
  push:
    branches: [main]
    paths:
      - 'yomu-pace/**'
      - '.github/workflows/yomu-pace.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yomu-pace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm install --no-audit --no-fund
      - run: npm run check
