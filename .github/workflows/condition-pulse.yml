name: Condition Pulse

on:
  pull_request:
    paths:
      - 'condition-pulse/**'
      - '.github/workflows/condition-pulse.yml'
  push:
    branches: [main]
    paths:
      - 'condition-pulse/**'
      - '.github/workflows/condition-pulse.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: condition-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: condition-pulse/package.json
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: JavaScript syntax
        run: |
          find js scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
