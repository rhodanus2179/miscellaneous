<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05090f">
  <title>miscellaneous</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: clamp(28px, 7vw, 90px); background: #05090f; color: #e7f1f6; }
    main { max-width: 980px; margin: auto; }
    .eyebrow { color: #7591a0; letter-spacing: .16em; font-size: 11px; }
    h1 { margin: 8px 0 50px; font-size: clamp(40px, 8vw, 88px); font-weight: 500; letter-spacing: -.05em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
    article { min-height: 260px; padding: 24px; border: 1px solid #213542; background: linear-gradient(145deg, #0a1520, #071019); }
    article h2 { margin: 7px 0 16px; font-size: 29px; font-weight: 500; }
    article p { color: #9bb0bb; line-height: 1.8; font-family: system-ui, sans-serif; }
    a { display: inline-block; margin-top: 18px; color: #91e7f8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #91e7f8; outline-offset: 4px; }
    .status { color: #80cba9; font-size: 10px; letter-spacing: .1em; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">EXPERIMENTS / VISUAL TOOLS / ODDITIES</p>
    <h1>miscellaneous</h1>
    <section class="grid" aria-label="アプリ一覧">
      <article>
        <span class="status">v0.1 · LIVE DATA</span>
        <h2>Earth Pulse</h2>
        <p>地震、自然イベント、宇宙天気、ISS、昼夜の移動を、一つの惑星の鼓動として眺めるリアルタイム・プラネタリウム。</p>
        <a href="./earth-pulse/">LAUNCH EARTH PULSE →</a>
      </article>
      <article>
        <span class="status">v0.2 · LOCAL DATA</span>
        <h2>Condition Pulse</h2>
        <p>朝・昼・夜に3問だけ答え、本人の平常値との差と一日のコンディションの揺らぎを端末内で観測するセルフモニタリングアプリ。</p>
        <a href="./condition-pulse/">LAUNCH CONDITION PULSE →</a>
      </article>
    </section>
  </main>
</body>
</html>
